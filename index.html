  font-family: var(--kz-font);
  font-size: 12.5px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.16s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}
.kz-btn:hover { transform: translateY(-1px); border-color: var(--kz-cyan); }
.kz-btn.primary {
  background: linear-gradient(135deg, #0EA5E9, #38D5E7);
  color: #04111F;
  border-color: transparent;
}
.kz-btn.gold {
  background: linear-gradient(135deg, #D97706, #F3BE62);
  color: #1A1002;
  border-color: transparent;
}

/* Hero Composite Score Box */
.hero-score-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 18px 16px;
  border-radius: 16px;
  background: rgba(7, 15, 29, 0.65);
  border: 1px solid var(--kz-border);
  text-align: center;
}
[data-theme="light"] .hero-score-card { background: #F8FAFC; }

.score-ring-wrap {
  position: relative;
  width: 106px;
  height: 106px;
}
.score-ring-svg { width: 106px; height: 106px; transform: rotate(-90deg); }
.score-ring-bg { fill: none; stroke: rgba(148, 179, 224, 0.14); stroke-width: 8; }
.score-ring-fg {
  fill: none;
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s cubic-bezier(0.22, 1, 0.36, 1);
}
.score-ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.score-ring-num {
  font-family: var(--kz-mono);
  font-size: 28px;
  font-weight: 800;
  line-height: 1;
}
.score-ring-max {
  font-family: var(--kz-mono);
  font-size: 10px;
  color: var(--kz-muted);
  margin-top: 2px;
}
.hero-sparkline { width: 100%; height: 32px; margin-top: 4px; }

/* ============================================================
   PANELS & POINTER SPOTLIGHT
   ============================================================ */
.panel {
  position: relative;
  border-radius: var(--kz-radius);
  border: 1px solid var(--kz-border);
  background: var(--kz-surface);
  box-shadow: var(--kz-shadow);
  overflow: hidden;
  transition: border-color 0.2s ease;
}
.panel::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(380px circle at var(--mx, -400px) var(--my, -400px), rgba(56, 213, 231, 0.08), transparent 60%);
  opacity: 0;
  transition: opacity 0.25s ease;
}
.panel:hover::after { opacity: 1; }
.panel-body { position: relative; z-index: 2; padding: 20px 22px; }
.panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-family: var(--kz-mono);
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--kz-cyan);
  margin-bottom: 16px;
}
.panel-title::before {
  content: '';
  display: inline-block;
  width: 3px; height: 14px;
  border-radius: 3px;
  background: linear-gradient(180deg, var(--kz-cyan), var(--kz-green));
  margin-right: 8px;
  vertical-align: middle;
}
.panel-title-left { display: flex; align-items: center; }

/* 5-PILLAR SCORING GRID */
.pillars-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
}
.pillar-card {
  padding: 13px 14px;
  border-radius: 12px;
  background: rgba(7, 15, 29, 0.52);
  border: 1px solid var(--kz-border);
  display: flex;
  flex-direction: column;
  gap: 7px;
}
[data-theme="light"] .pillar-card { background: #F8FAFC; }
.pillar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.pillar-name {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--kz-muted);
}
.pillar-val {
  font-family: var(--kz-mono);
  font-size: 13px;
  font-weight: 800;
}
.pillar-track {
  height: 5px;
  border-radius: 99px;
  background: rgba(148, 179, 224, 0.14);
  overflow: hidden;
}
.pillar-fill {
  height: 100%;
  width: 0;
  border-radius: 99px;
  transition: width 0.85s cubic-bezier(0.22, 1, 0.36, 1);
}
.pillar-note {
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--kz-text-soft);
}

/* ============================================================
   FLAGSHIP ASYMMETRIC SCENARIO COMMAND STAGE
   ============================================================ */
@property --kz-angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}
@keyframes kzOrbit { to { --kz-angle: 360deg; } }

.scenarios-stage {
  display: grid;
  grid-template-columns: 1.38fr 1fr;
  gap: 16px;
  align-items: stretch;
}
.sc-primary-wrap {
  position: relative;
  border-radius: 18px;
  padding: 2px;
  background: linear-gradient(135deg, rgba(243,190,98,0.45), rgba(56,213,231,0.35));
}
.sc-primary-wrap.tier-high {
  background: linear-gradient(135deg, rgba(56,213,231,0.75), rgba(52,211,153,0.65));
  box-shadow: 0 0 32px -10px rgba(56, 213, 231, 0.45);
}
.sc-primary-wrap.tier-ultra {
  background: conic-gradient(from var(--kz-angle), #34D399, #38D5E7, #F3BE62, #34D399);
  animation: kzOrbit 4.5s linear infinite;
  box-shadow: 0 0 42px -10px rgba(52, 211, 153, 0.55);
}
.sc-primary-wrap.tier-bear {
  background: conic-gradient(from var(--kz-angle), #FB7185, #F3BE62, #FB7185);
  animation: kzOrbit 5.5s linear infinite;
  box-shadow: 0 0 36px -10px rgba(251, 113, 133, 0.48);
}

.sc-primary-card {
  height: 100%;
  border-radius: 16px;
  background: linear-gradient(155deg, rgba(16, 29, 53, 0.98), rgba(8, 16, 30, 0.99));
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 14px;
}
[data-theme="light"] .sc-primary-card { background: #FFFFFF; }

.sc-top-bar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}
.sc-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--kz-mono);
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.06em;
  padding: 4px 10px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.sc-pill.bull { background: var(--kz-green-bg); color: var(--kz-green); border: 1px solid rgba(52,211,153,0.35); }
.sc-pill.bear { background: var(--kz-rose-bg); color: var(--kz-rose); border: 1px solid rgba(251,113,133,0.35); }
.sc-pill.neutral { background: var(--kz-gold-bg); color: var(--kz-gold); border: 1px solid rgba(243,190,98,0.35); }

.sc-hero-label {
  font-size: 18px;
  font-weight: 800;
  line-height: 1.3;
  color: var(--kz-text);
}

.prob-ring-box {
  position: relative;
  width: 82px;
  height: 82px;
  flex-shrink: 0;
}
.prob-ring-svg { width: 82px; height: 82px; transform: rotate(-90deg); }
.prob-ring-bg { fill: none; stroke: rgba(148,179,224,0.16); stroke-width: 7; }
.prob-ring-fg {
  fill: none;
  stroke-width: 7;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.95s cubic-bezier(0.22, 1, 0.36, 1);
}
.prob-ring-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.prob-ring-num { font-family: var(--kz-mono); font-size: 19px; font-weight: 800; line-height: 1; }
.prob-ring-lbl { font-size: 9px; color: var(--kz-muted); text-transform: uppercase; margin-top: 2px; }

.sc-detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.sc-detail-box {
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(7, 15, 29, 0.56);
  border: 1px solid var(--kz-border);
}
[data-theme="light"] .sc-detail-box { background: #F8FAFC; }
.sc-detail-k {
  font-family: var(--kz-mono);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--kz-muted);
  margin-bottom: 5px;
}
.sc-detail-v { font-size: 13px; color: var(--kz-text); line-height: 1.55; }

.scenarios-secondary {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.scenario-card {
  flex: 1;
  padding: 15px 16px;
  border-radius: 14px;
  border: 1px solid var(--kz-border);
  background: rgba(16, 29, 53, 0.62);
  border-top: 3px solid var(--kz-gold);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 8px;
  transition: transform 0.2s ease, border-color 0.2s ease;
}
[data-theme="light"] .scenario-card { background: #F8FAFC; }
.scenario-card.bull { border-top-color: var(--kz-green); }
.scenario-card.bear { border-top-color: var(--kz-rose); }
.scenario-card.neutral { border-top-color: var(--kz-gold); }

.sc-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sc-sec-id { font-family: var(--kz-mono); font-size: 11px; font-weight: 800; color: var(--kz-muted); }
.sc-sec-prob { font-family: var(--kz-mono); font-size: 16px; font-weight: 800; }
.sc-sec-prob.bull { color: var(--kz-green); }
.sc-sec-prob.bear { color: var(--kz-rose); }
.sc-sec-prob.neutral { color: var(--kz-gold); }
.sc-sec-title { font-size: 13.5px; font-weight: 700; color: var(--kz-text); }
.sc-sec-line { font-size: 12px; color: var(--kz-text-soft); line-height: 1.5; }
.sc-sec-line strong { color: var(--kz-muted); font-size: 10.5px; text-transform: uppercase; font-family: var(--kz-mono); margin-right: 4px; }

.prob-track { height: 4px; border-radius: 99px; background: rgba(148,179,224,0.14); overflow: hidden; margin-top: 4px; }
.prob-fill { height: 100%; width: 0; border-radius: 99px; transition: width 0.85s cubic-bezier(0.22, 1, 0.36, 1); }
.prob-fill.bull { background: var(--kz-green); }
.prob-fill.bear { background: var(--kz-rose); }
.prob-fill.neutral { background: var(--kz-gold); }

/* ============================================================
   CONTENT GRIDS: MTF, CATALYSTS, SECTORS, VIEWS, HORIZON, ACTION
   ============================================================ */
.tf-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.tf-card {
  padding: 15px 16px;
  border-radius: 13px;
  background: rgba(7, 15, 29, 0.52);
  border: 1px solid var(--kz-border);
  border-top: 2.5px solid var(--kz-cyan);
}
[data-theme="light"] .tf-card { background: #F8FAFC; }
.tf-card.w1 { border-top-color: var(--kz-purple); }
.tf-card.d3 { border-top-color: var(--kz-blue); }
.tf-card.d1 { border-top-color: var(--kz-green); }
.tf-card.m15 { border-top-color: var(--kz-gold); }
.tf-head {
  font-family: var(--kz-mono);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.tf-body { font-size: 13px; line-height: 1.65; color: var(--kz-text-soft); }

.catalyst-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px;
}
.catalyst-card {
  padding: 14px 16px;
  border-radius: 13px;
  background: rgba(7, 15, 29, 0.52);
  border: 1px solid var(--kz-border);
  border-left: 3px solid var(--kz-gold);
}
[data-theme="light"] .catalyst-card { background: #F8FAFC; }
.catalyst-card.positive { border-left-color: var(--kz-green); }
.catalyst-card.negative { border-left-color: var(--kz-rose); }
.catalyst-card.neutral { border-left-color: var(--kz-gold); }
.cat-title { font-size: 13px; font-weight: 700; color: var(--kz-text); margin: 6px 0 5px; }
.cat-detail { font-size: 12.5px; color: var(--kz-text-soft); line-height: 1.58; }

.sector-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.sector-box {
  padding: 13px 14px;
  border-radius: 12px;
  background: rgba(7, 15, 29, 0.52);
  border: 1px solid var(--kz-border);
}
[data-theme="light"] .sector-box { background: #F8FAFC; }
.sector-title {
  font-family: var(--kz-mono);
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 9px;
}
.sector-tag {
  display: block;
  font-size: 12px;
  color: var(--kz-text-soft);
  background: rgba(148, 179, 224, 0.09);
  border: 1px solid var(--kz-border);
  padding: 6px 9px;
  border-radius: 8px;
  margin-bottom: 6px;
  line-height: 1.45;
}

.dual-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.horizon-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.info-box {
  padding: 14px 16px;
  border-radius: 13px;
  background: rgba(7, 15, 29, 0.52);
  border: 1px solid var(--kz-border);
}
[data-theme="light"] .info-box { background: #F8FAFC; }
.info-title {
  font-family: var(--kz-mono);
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 8px;
}
.info-text { font-size: 13px; color: var(--kz-text-soft); line-height: 1.65; }

/* Action Plan 8-Card Grid */
.action-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.action-box {
  padding: 13px 15px;
  border-radius: 12px;
  background: rgba(7, 15, 29, 0.52);
  border: 1px solid var(--kz-border);
  border-left: 3px solid var(--kz-green);
}
[data-theme="light"] .action-box { background: #F8FAFC; }
.action-box.gold { border-left-color: var(--kz-gold); }
.action-box.rose { border-left-color: var(--kz-rose); }
.action-box.purple { border-left-color: var(--kz-purple); }
.action-box.cyan { border-left-color: var(--kz-cyan); }
.ab-label {
  font-family: var(--kz-mono);
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--kz-muted);
  margin-bottom: 5px;
}
.ab-text { font-size: 13px; color: var(--kz-text); line-height: 1.58; }

/* Interactive Persistent Checklist */
.checklist { display: flex; flex-direction: column; gap: 8px; }
.check-item {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 11px 14px;
  border-radius: 11px;
  background: rgba(7, 15, 29, 0.52);
  border: 1px solid var(--kz-border);
  cursor: pointer;
  transition: border-color 0.18s ease, background 0.18s ease;
}
[data-theme="light"] .check-item { background: #F8FAFC; }
.check-item:hover { border-color: rgba(56, 213, 231, 0.40); }
.check-box {
  width: 20px; height: 20px;
  border-radius: 6px;
  border: 1.5px solid var(--kz-muted);
  display: grid; place-items: center;
  font-size: 12px;
  font-weight: 800;
  color: transparent;
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.16s ease;
}
.check-item.checked {
  border-color: rgba(52, 211, 153, 0.36);
  background: rgba(52, 211, 153, 0.08);
}
.check-item.checked .check-box {
  background: var(--kz-green);
  border-color: var(--kz-green);
  color: #04111F;
}
.check-item.checked .check-text {
  text-decoration: line-through;
  color: var(--kz-muted);
}
.check-text { font-size: 13px; color: var(--kz-text-soft); line-height: 1.55; }

/* Ecosystem Banner */
.eco-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
  padding: 18px 22px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(56, 213, 231, 0.12), rgba(243, 190, 98, 0.10));
  border: 1px solid rgba(56, 213, 231, 0.28);
}
.disclaimer {
  font-size: 11.5px;
  color: var(--kz-muted);
  font-style: italic;
  text-align: center;
  padding: 6px 12px;
}

/* Mobile FAB + Bottom Sheet */
.fab {
  display: none;
  position: fixed;
  right: 18px;
  bottom: 20px;
  z-index: 150;
  padding: 12px 16px;
  border-radius: 999px;
  border: 1px solid rgba(56,213,231,0.45);
  background: linear-gradient(135deg, #0E223F, #102B4E);
  color: #FFFFFF;
  font-family: var(--kz-font);
  font-size: 13px;
  font-weight: 700;
  box-shadow: 0 14px 32px rgba(0, 0, 0, 0.5);
  cursor: pointer;
  align-items: center;
  gap: 8px;
}
.fab-badge {
  background: var(--kz-cyan);
  color: #04111F;
  font-family: var(--kz-mono);
  font-size: 11px;
  font-weight: 800;
  padding: 1px 7px;
  border-radius: 999px;
}
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(3, 8, 18, 0.72);
  backdrop-filter: blur(4px);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.bottom-sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  max-height: 82vh;
  z-index: 210;
  background: var(--kz-bg-2);
  border-top: 1px solid var(--kz-border-strong);
  border-radius: 20px 20px 0 0;
  transform: translateY(100%);
  transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
  display: flex;
  flex-direction: column;
}
.bottom-sheet.open { transform: translateY(0); }
.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--kz-border);
}
.sheet-title { font-size: 14px; font-weight: 800; }
.sheet-body { overflow-y: auto; padding: 12px 16px 26px; display: flex; flex-direction: column; gap: 10px; }

/* Toast & Sparkles */
.toast-wrap {
  position: fixed;
  right: 20px;
  bottom: 22px;
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  padding: 11px 16px;
  border-radius: 12px;
  background: var(--kz-surface-solid);
  border: 1px solid var(--kz-cyan);
  color: var(--kz-text);
  font-size: 12.5px;
  font-weight: 600;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
  cursor: pointer;
}
.kz-sparkle {
  position: fixed;
  width: 6px; height: 6px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.55s ease;
}

.empty {
  text-align: center;
  padding: 64px 20px;
  color: var(--kz-muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.spinner {
  width: 30px; height: 30px;
  border: 3px solid var(--kz-border);
  border-top-color: var(--kz-cyan);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1160px) {
  .eco-dock { display: none; }
  .eco-mobile-strip { display: flex; }
  .pillars-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sector-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1040px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .fab { display: inline-flex; }
  .main { padding: 16px 14px 86px; }
  .scenarios-stage { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .header { padding: 0 12px; }
  .brand-badge, .last-sync { display: none; }
  .hero { padding: 18px 16px; }
  .hero-inner { grid-template-columns: 1fr; }
  .hero-score-card { flex-direction: row; justify-content: space-around; padding: 14px; }
  .pillars-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tf-grid, .dual-grid, .horizon-grid, .action-grid, .sc-detail-grid, .sector-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>

function L(k) {
  const d = I18N[currentLang] || I18N.vi;
  return d[k] !== undefined ? d[k] : I18N.vi[k];
}

function applyStaticLang() {
  document.documentElement.lang = currentLang;
  document.title = L('title');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = L(el.getAttribute('data-i18n'));
    if (typeof v === 'string') el.textContent = v;
  });
  const advT = document.getElementById('advFilterToggle');
  const advB = document.getElementById('advFiltersBox');
  if (advT && advB) advT.textContent = advB.classList.contains('collapsed') ? L('moreFilters') : L('lessFilters');
  const si = document.getElementById('searchInput');
  if (si) si.placeholder = L('searchPh');
  const lb = document.getElementById('langToggle');
  if (lb) {
    lb.textContent = currentLang === 'en' ? 'VI' : 'EN';
    lb.title = currentLang === 'en' ? 'Chuyển sang Tiếng Việt' : 'Switch to English';
  }
}

function setLang(next) {
  currentLang = next === 'en' ? 'en' : 'vi';
  try { localStorage.setItem('kz-lang', currentLang); } catch(_) {}
  try {
    const dom = /\.?kenvinzone\.com$/i.test(location.hostname) ? '; domain=.kenvinzone.com' : '';
    document.cookie = `kz-lang=${currentLang}; path=/${dom}; max-age=31536000; SameSite=Lax`;
  } catch(_) {}
  applyStaticLang();
  buildMonthOptions();
  renderList();
  renderMain();
  updateLastSync();
}

// ============================================================
// THEME, SCROLL BEAM & SPARKLES
// ============================================================
const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

(function initChrome() {
  const tBtn = document.getElementById('themeToggle');
  if (tBtn) {
    tBtn.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('kz-theme', next); } catch(_) {}
      try {
        const dom = /\.?kenvinzone\.com$/i.test(location.hostname) ? '; domain=.kenvinzone.com' : '';
        document.cookie = `kz-theme=${next}; path=/${dom}; max-age=31536000; SameSite=Lax`;
      } catch(_) {}
    });
  }
  const beam = document.getElementById('kzScrollBeam');
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (!ticking && beam) {
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        beam.style.transform = `scaleX(${Math.min(1, Math.max(0, window.scrollY / max)).toFixed(4)})`;
      });
    }
  }, { passive: true });

  if (!prefersReduced) {
    document.addEventListener('pointermove', (e) => {
      const card = e.target && e.target.closest ? e.target.closest('.panel') : null;
      if (!card) return;
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left).toFixed(1) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top).toFixed(1) + 'px');
    }, { passive: true });
  }
})();

function spawnSparkles(x, y) {
  if (prefersReduced) return;
  const colors = ['#38D5E7', '#34D399', '#F3BE62', '#FFFFFF'];
  for (let i = 0; i < 10; i++) {
    const dot = document.createElement('span');
    dot.className = 'kz-sparkle';
    dot.style.left = (x || window.innerWidth / 2) + 'px';
    dot.style.top = (y || window.innerHeight / 2) + 'px';
    dot.style.background = colors[i % colors.length];
    document.body.appendChild(dot);
    const a = (Math.PI * 2 * i) / 10 + (Math.random() - 0.5) * 0.4;
    const d = 24 + Math.random() * 34;
    requestAnimationFrame(() => {
      dot.style.transform = `translate3d(${(Math.cos(a)*d).toFixed(1)}px, ${(Math.sin(a)*d - 8).toFixed(1)}px, 0) scale(0)`;
      dot.style.opacity = '0';
    });
    setTimeout(() => dot.remove(), 580);
  }
}

let heroCanvasRaf = null;
function startHeroCanvas() {
  if (heroCanvasRaf) cancelAnimationFrame(heroCanvasRaf);
  const canvas = document.getElementById('kzHeroCanvas');
  if (!canvas || prefersReduced) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  let phase = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (w <= 0 || h <= 0) return;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function drawWave(w, h, yFrac, amp, freq, spd, color) {
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) {
      const u = i / 40;
      const x = u * w;
      const y = yFrac * h + Math.sin(u * freq + phase * spd) * amp + Math.cos(u * freq * 0.5 - phase * 0.6) * (amp * 0.4);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = color; ctx.lineWidth = 1.25; ctx.stroke();
  }
  function loop() {
    if (!document.body.contains(canvas)) return;
    if (!document.hidden) {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (w > 0 && h > 0) {
        ctx.clearRect(0, 0, w, h);
        phase += 0.012;
        drawWave(w, h, 0.34, 16, 4.8, 1.0, 'rgba(52, 211, 153, 0.16)');
        drawWave(w, h, 0.62, 20, 4.0, -0.8, 'rgba(56, 213, 231, 0.14)');
        drawWave(w, h, 0.80, 12, 5.6, 0.6, 'rgba(243, 190, 98, 0.10)');
      }
    }
    heroCanvasRaf = requestAnimationFrame(loop);
  }
  resize();
  loop();
}

// ============================================================
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtPrice(v) {
  const n = Number(v);
  if (Number.isFinite(n) && n > 0) return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return v ? String(v) : '—';
}
function fmtRelative(ts) {
  try {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '--';
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return L('justNow');
    if (diff < 3600) return L('minsAgo')(Math.floor(diff / 60));
    if (diff < 86400) return L('hrsAgo')(Math.floor(diff / 3600));
    if (diff < 604800) return L('daysAgo')(Math.floor(diff / 86400));
    return d.toLocaleDateString('vi-VN');
  } catch { return '--'; }
}
function getRaw(r) {
  if (!r) return {};
  if (typeof r.raw === 'object' && r.raw !== null) return r.raw;
  try { return JSON.parse(r.raw || '{}'); } catch { return {}; }
}
function getAL(r) { return getRaw(r)?.scoring?.action_label || ''; }
function getScore(r) { return Number(getRaw(r)?.scoring?.composite_score || 0); }
function getALClass(al) {
  const l = (al || '').toLowerCase();
  if (l.includes('buy') || l.includes('accumulate')) return 'al-buy';
  if (l.includes('hold')) return 'al-hold';
  if (l.includes('reduce')) return 'al-reduce';
  if (l.includes('profit') || l.includes('partial')) return 'al-profit';
  if (l.includes('avoid')) return 'al-avoid';
  return 'al-watch';
}
function getBiasType(bias) {
  const b = (bias || '').toLowerCase();
  if (b.includes('bull')) return 'bull';
  if (b.includes('bear')) return 'bear';
  return 'neutral';
}
function scoreColor(score) {
  if (score >= 68) return '#34D399';
  if (score >= 48) return '#F3BE62';
  return '#FB7185';
}
function getMonthKey(dt) {
  const d = new Date(dt);
  if (isNaN(d.getTime())) return '';
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

let allReports = [];
let filteredReports = [];
let selectedId = null;
let filters = { time: 'all', month: 'all', action: 'all', search: '' };
const CHECKLIST_KEY = 'kz_vnindex_checklist_v1';
let checklistState = {};
try { checklistState = JSON.parse(localStorage.getItem(CHECKLIST_KEY) || '{}'); } catch {}

async function tryFetchReports(url) {
  try {
    const res = await fetch(url + '?t=' + Date.now());
    if (!res.ok) return [];
    let txt = await res.text();
    txt = txt.replace(/"raw"\s*:\s*,\s*\{/g, '"raw":{');
    const data = JSON.parse(txt);
    if (Array.isArray(data)) return data;
    if (Array.isArray(data.reports)) return data.reports;
    return [];
  } catch { return []; }
}

async function loadData(notify = false) {
  const [fresh, hist] = await Promise.all([
    tryFetchReports('reports.json'),
    tryFetchReports('history.json')
  ]);
  let ls = [];
  try { ls = JSON.parse(localStorage.getItem('vnindex_reports') || '[]'); } catch {}

  const seen = new Set();
  const merged = [...fresh, ...hist, ...ls].filter(r => {
    const key = r && (r.id || r.datetime);
    if (!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  }).sort((a, b) => new Date(b.datetime || 0) - new Date(a.datetime || 0));

  allReports = merged;
  buildMonthOptions();
  applyFilters();
  if (!selectedId && filteredReports.length) selectedId = filteredReports[0].id;
  if (filteredReports.length && !filteredReports.some(r => r.id === selectedId)) selectedId = filteredReports[0].id;

  updateLastSync();
  updateStats();
  renderList();
  renderMain();
  if (notify) showToast(L('refreshed'));
}

function updateLastSync() {
  const el = document.getElementById('lastSync');
  if (el && allReports.length) el.textContent = fmtRelative(allReports[0].datetime);
}

function buildMonthOptions() {
  const sel = document.getElementById('monthSelect');
  if (!sel) return;
  const prev = filters.month;
  const months = [...new Set(allReports.map(r => getMonthKey(r.datetime)).filter(Boolean))].sort().reverse();
  sel.innerHTML = `<option value="all">${L('allMonths')}</option>` +
    months.map(mk => {
      const [y, m] = mk.split('-');
      return `<option value="${mk}" ${mk === prev ? 'selected' : ''}>${L('monthFmt')(parseInt(m), y)}</option>`;
    }).join('');
}

function applyFilters() {
  const now = new Date();
  const q = filters.search.toLowerCase();
  filteredReports = allReports.filter(r => {
    const d = r.datetime ? new Date(r.datetime) : null;
    if (filters.time === 'today' && d && d.toDateString() !== now.toDateString()) return false;
    if (filters.time === 'week' && d) { const w = new Date(now); w.setDate(w.getDate() - 7); if (d < w) return false; }
    if (filters.time === 'month' && d && (d.getMonth() !== now.getMonth() || d.getFullYear() !== now.getFullYear())) return false;
    if (filters.month !== 'all' && getMonthKey(r.datetime) !== filters.month) return false;
    if (filters.action !== 'all' && getAL(r) !== filters.action) return false;
    if (q) {
      const raw = getRaw(r);
      const hay = [r.id, r.date_display, r.price_current, getAL(r), raw.quick_view, raw.market_context].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function updateStats() {
  document.getElementById('statTotal').textContent = filteredReports.length;
  document.getElementById('statBuy').textContent = filteredReports.filter(r => getAL(r) === 'Buy').length;
  document.getElementById('statAvoid').textContent = filteredReports.filter(r => ['Reduce','Take Profit Partial','Avoid New Entry'].includes(getAL(r))).length;
  const sc = filteredReports.map(getScore).filter(x => x > 0);
  document.getElementById('statAvg').textContent = sc.length ? Math.round(sc.reduce((a,b)=>a+b,0) / sc.length) : '--';
  const fb = document.getElementById('fabBadge');
  if (fb) fb.textContent = filteredReports.length;
}

function resetFilters() {
  filters = { time: 'all', month: 'all', action: 'all', search: '' };
  document.getElementById('searchInput').value = '';
  document.getElementById('monthSelect').value = 'all';
  document.getElementById('actionSelect').value = 'all';
  document.querySelectorAll('#timeChips .chip').forEach(c => c.classList.toggle('active', c.dataset.time === 'all'));
  applyFiltersAndRender();
}

function applyFiltersAndRender() {
  applyFilters();
  selectedId = filteredReports.length ? filteredReports[0].id : null;
  updateStats();
  renderList();
  renderMain();
}

function buildScoreSparkline() {
  const ptsArr = allReports.slice(0, 12).reverse().map(getScore).filter(x => x > 0);
  if (ptsArr.length < 2) return '';
  const w = 180, h = 32, pad = 3;
  const stepX = (w - pad * 2) / (ptsArr.length - 1);
  const pts = ptsArr.map((v, i) => `${(pad + i * stepX).toFixed(1)},${(h - pad - (v / 100) * (h - pad * 2)).toFixed(1)}`).join(' ');
  const col = scoreColor(ptsArr[ptsArr.length - 1]);
  return `
    <svg class="hero-sparkline" viewBox="0 0 ${w} ${h}" aria-hidden="true">
      <defs><linearGradient id="vSpG" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="${col}" stop-opacity="0.30"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="${pts} ${w - pad},${h} ${pad},${h}" fill="url(#vSpG)"/>
    </svg>`;
}

function buildScenariosStage(scenarios) {
  if (!scenarios || !scenarios.length) return '';

  const rest = sorted.slice(1);

  const pProb = Math.min(100, Math.max(0, Math.round(Number(primary.probability || 0))));
  const pBias = getBiasType(primary.bias);
  const tierCls = pProb >= 70
    ? (pBias === 'bear' ? 'tier-bear' : 'tier-ultra')
    : pProb >= 55
      ? (pBias === 'bear' ? 'tier-bear' : 'tier-high')
      : '';
  const ringCol = pBias === 'bull' ? '#34D399' : pBias === 'bear' ? '#FB7185' : '#F3BE62';
  const radius = 34;
  const circ = +(2 * Math.PI * radius).toFixed(2);
  const offset = +(circ * (1 - pProb / 100)).toFixed(2);

  const primaryHtml = `
    <div class="sc-primary-wrap ${tierCls}">
      <div class="sc-primary-card">
        <div class="sc-top-bar">
          <div>
            <span class="sc-pill ${pBias}">${pProb >= 65 ? L('pillUltra')(pProb) : L('pillMain')(esc(primary.id || 'KB1'), pProb)}</span>
            <div class="sc-hero-label">${esc(primary.label || '—')}</div>
          </div>
          <div class="prob-ring-box">
            <svg class="prob-ring-svg" viewBox="0 0 82 82" aria-hidden="true">
              <circle class="prob-ring-bg" cx="41" cy="41" r="${radius}"></circle>
              <circle class="prob-ring-fg" cx="41" cy="41" r="${radius}" stroke="${ringCol}" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" data-ring-target="${offset}"></circle>
            </svg>
            <div class="prob-ring-text">
              <span class="prob-ring-num" data-count-prob="${pProb}">0%</span>
              <span class="prob-ring-lbl">${L('probLbl')}</span>
            </div>
          </div>
        </div>
        <div class="sc-detail-grid">
          <div class="sc-detail-box">
            <div class="sc-detail-k">⚡ ${L('triggerLbl')}</div>
            <div class="sc-detail-v">${esc(primary.trigger || '—')}</div>
          </div>
          <div class="sc-detail-box">
            <div class="sc-detail-k">🎯 ${L('targetLbl')}</div>
            <div class="sc-detail-v" style="color:${ringCol};font-weight:600">${esc(primary.target || '—')}</div>
          </div>
        </div>
      </div>
    </div>`;

  const restHtml = rest.map(s => {
    const prob = Math.min(100, Math.max(0, Math.round(Number(s.probability || 0))));
    const bt = getBiasType(s.bias);
    return `
      <div class="scenario-card ${bt}">
        <div>
          <div class="sc-sec-head">
            <span class="sc-sec-id">${esc(s.id || '')}</span>
            <span class="sc-sec-prob ${bt}">${prob}%</span>
          </div>
          <div class="sc-sec-title">${esc(s.label || '—')}</div>
        </div>
        <div class="sc-sec-line"><strong>Trigger:</strong>${esc(s.trigger || '—')}</div>
        <div class="sc-sec-line"><strong>Target:</strong>${esc(s.target || '—')}</div>
        <div class="prob-track"><div class="prob-fill ${bt}" data-pct="${prob}"></div></div>
      </div>`;
  }).join('');

  return `
    <section class="panel" style="border-color:rgba(243,190,98,0.28)">
      <div class="panel-body">
        <div class="panel-title"><span class="panel-title-left">${L('secScenarios')}</span></div>
        <div class="scenarios-stage">
          ${primaryHtml}
          <div class="scenarios-secondary">${restHtml}</div>
        </div>
      </div>
    </section>`;
}

        <div class="info-text" style="margin-bottom:16px">${esc(raw.money_flow || '—')}</div>
        ${(sr.leaders || sr.emerging || sr.hot_caution || sr.avoid) ? `
          <div class="sector-grid">
            <div class="sector-box"><div class="sector-title" style="color:var(--kz-green)">${L('srLead')}</div>${tagsHtml(sr.leaders)}</div>
            <div class="sector-box"><div class="sector-title" style="color:var(--kz-cyan)">${L('srEmerge')}</div>${tagsHtml(sr.emerging)}</div>
            <div class="sector-box"><div class="sector-title" style="color:var(--kz-gold)">${L('srHot')}</div>${tagsHtml(sr.hot_caution)}</div>
            <div class="sector-box"><div class="sector-title" style="color:var(--kz-rose)">${L('srAvoid')}</div>${tagsHtml(sr.avoid)}</div>
          </div>` : ''}
      </div>
    </section>

    <!-- INSTITUTIONAL VS RETAIL + 3 HORIZONS -->
    <section class="panel">
      <div class="panel-body">
        <div class="panel-title"><span class="panel-title-left">${L('secViews')}</span></div>
        <div class="dual-grid" style="margin-bottom:18px">
          <div class="info-box"><div class="info-title" style="color:var(--kz-green)">${L('vInst')}</div><div class="info-text">${esc(raw.institutional_view || '—')}</div></div>
          <div class="info-box"><div class="info-title" style="color:var(--kz-blue)">${L('vRetail')}</div><div class="info-text">${esc(raw.retail_view || '—')}</div></div>
        </div>
        ${(hz.today || hz.this_week || hz.medium_term) ? `
          <div class="panel-title"><span class="panel-title-left">${L('secHorizon')}</span></div>
          <div class="horizon-grid">
            <div class="info-box"><div class="info-title" style="color:var(--kz-gold)">${L('hToday')}</div><div class="info-text">${esc(hz.today || '—')}</div></div>
            <div class="info-box"><div class="info-title" style="color:var(--kz-green)">${L('hWeek')}</div><div class="info-text">${esc(hz.this_week || '—')}</div></div>
            <div class="info-box"><div class="info-title" style="color:var(--kz-cyan)">${L('hMid')}</div><div class="info-text">${esc(hz.medium_term || '—')}</div></div>
          </div>` : ''}
      </div>
    </section>

    <!-- KENVINZONE ECOSYSTEM CROSS-LINK -->
    <section class="eco-banner">
      <div>
        <div class="mono" style="font-size:11px;color:var(--kz-cyan);font-weight:700;letter-spacing:.08em">${L('ecoSub')}</div>
        <div style="font-size:15px;font-weight:800;margin-top:3px">${L('ecoTitle')}</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a href="https://gold-nasdaq.kenvinzone.com/" target="_blank" rel="noopener noreferrer" class="kz-btn primary">${L('ecoBtn1')}</a>
        <a href="https://bias.kenvinzone.com/" target="_blank" rel="noopener noreferrer" class="kz-btn gold">${L('ecoBtn2')}</a>
      </div>
    </section>

    ${raw.disclaimer ? `<div class="disclaimer">${esc(raw.disclaimer)}</div>` : ''}
  `;

  // Quick switcher handlers
  container.querySelectorAll('[data-quick]').forEach(btn => {
    btn.onclick = () => { selectedId = btn.dataset.quick; renderList(); renderMain(); };
  });

  // Start Hero Canvas
  startHeroCanvas();

  // GSAP Entrance + Price & Score Roll-Up
  if (!prefersReduced && typeof window.gsap !== 'undefined') {
    window.gsap.fromTo(
      container.querySelectorAll('.hero, .panel'),
      { y: 14, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.42, stagger: 0.04, ease: 'power2.out', clearProps: 'transform,opacity' }
    );
    const priceEl = document.getElementById('heroPriceNum');
    const pNum = Number(priceEl?.dataset.price || 0);
    if (priceEl && pNum > 0) {
      const obj = { v: pNum * 0.992 };
      window.gsap.to(obj, { v: pNum, duration: 0.65, ease: 'power3.out', onUpdate: () => { priceEl.textContent = fmtPrice(obj.v); } });
    }
  }

  // Animate Rings + Bars + Count-Ups
  setTimeout(() => {
    container.querySelectorAll('[data-pct]').forEach(el => { el.style.width = el.dataset.pct + '%'; });
    container.querySelectorAll('[data-ring-target]').forEach(el => { el.style.strokeDashoffset = el.dataset.ringTarget; });
    container.querySelectorAll('[data-count-score]').forEach(el => {
      const t = Number(el.dataset.countScore || 0);
      if (!prefersReduced && typeof window.gsap !== 'undefined') {
        const o = { v: 0 };
        window.gsap.to(o, { v: t, duration: 0.85, ease: 'power3.out', onUpdate: () => { el.textContent = Math.round(o.v); } });
      } else { el.textContent = t; }
    });
    container.querySelectorAll('[data-count-prob]').forEach(el => {
      const t = Number(el.dataset.countProb || 0);
      if (!prefersReduced && typeof window.gsap !== 'undefined') {
        const o = { v: 0 };
        window.gsap.to(o, { v: t, duration: 0.9, ease: 'power3.out', onUpdate: () => { el.textContent = Math.round(o.v) + '%'; } });
      } else { el.textContent = t + '%'; }
    });
  }, 70);

  // Copy Quick Brief button
  const copyBtn = document.getElementById('copyBriefBtn');
  if (copyBtn) {
    const topSc = [...scenarios].sort((a,b) => Number(b.probability||0) - Number(a.probability||0))[0];
    const brief = `🇻🇳 VNINDEX ${fmtPrice(r.price_current)} (${r.date_display} ${r.time_display})\n• Score: ${score}/100 | Action: ${al} (${sc.action_probability_pct||0}%)\n• Quan điểm: ${raw.quick_view || ''}${topSc ? `\n• Kịch bản chính (${topSc.probability}%): ${topSc.label} → ${topSc.target}` : ''}\n🔗 https://vnindex.kenvinzone.com/`;
    copyBtn.onclick = (e) => {
      navigator.clipboard?.writeText(brief).catch(() => {});
      showToast(L('copiedBrief'));
      spawnSparkles(e.clientX, e.clientY);
    };
  }

  // Interactive Checklist persistence
  container.querySelectorAll('.check-item').forEach(el => {
    el.onclick = (e) => {
      const { rid, idx } = el.dataset;
      el.classList.toggle('checked');
      (checklistState[rid] ||= {})[idx] = el.classList.contains('checked');
      try { localStorage.setItem(CHECKLIST_KEY, JSON.stringify(checklistState)); } catch {}
      if (el.classList.contains('checked')) spawnSparkles(e.clientX, e.clientY);
    };
  });
}

// ============================================================
// UI CONTROLS, SHEET, TOAST & SHORTCUTS
// ============================================================
function openSheet() { document.getElementById('sheetBackdrop').classList.add('open'); document.getElementById('bottomSheet').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSheet() { document.getElementById('sheetBackdrop').classList.remove('open'); document.getElementById('bottomSheet').classList.remove('open'); document.body.style.overflow = ''; }
function showToast(msg) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  el.onclick = () => el.remove();
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

document.getElementById('fabBtn').addEventListener('click', openSheet);
document.getElementById('sheetClose').addEventListener('click', closeSheet);
document.getElementById('sheetBackdrop').addEventListener('click', closeSheet);

const advToggle = document.getElementById('advFilterToggle');
const advBox = document.getElementById('advFiltersBox');
advToggle.addEventListener('click', () => {
  const isCol = advBox.classList.toggle('collapsed');
  advToggle.classList.toggle('open', !isCol);
  advToggle.textContent = isCol ? L('moreFilters') : L('lessFilters');
});

document.querySelectorAll('#timeChips .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    filters.time = btn.dataset.time;
    document.querySelectorAll('#timeChips .chip').forEach(c => c.classList.toggle('active', c === btn));
    applyFiltersAndRender();
  });
});
document.getElementById('monthSelect').addEventListener('change', (e) => { filters.month = e.target.value; applyFiltersAndRender(); });
document.getElementById('actionSelect').addEventListener('change', (e) => { filters.action = e.target.value; applyFiltersAndRender(); });

let searchTimer;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { filters.search = e.target.value.trim(); applyFiltersAndRender(); }, 180);
});

document.getElementById('refreshBtn').addEventListener('click', async () => {
  const b = document.getElementById('refreshBtn');
  b.classList.add('spinning');
  await loadData(true);
  setTimeout(() => b.classList.remove('spinning'), 500);
});
document.getElementById('langToggle').addEventListener('click', () => setLang(currentLang === 'en' ? 'vi' : 'en'));

document.addEventListener('keydown', (e) => {
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  const idx = filteredReports.findIndex(r => r.id === selectedId);
  if (e.key === 'j' && idx < filteredReports.length - 1) { selectedId = filteredReports[idx + 1].id; renderList(); renderMain(); }
  else if (e.key === 'k' && idx > 0) { selectedId = filteredReports[idx - 1].id; renderList(); renderMain(); }
  else if (e.key === '/') { e.preventDefault(); document.getElementById('searchInput')?.focus(); }
  else if (e.key === 'Escape') closeSheet();
});

applyStaticLang();
loadData(false);
setInterval(() => loadData(false), 5 * 60 * 1000);
</script>
</body>
</html>
